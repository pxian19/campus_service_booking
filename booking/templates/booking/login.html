{% extends 'booking/base.html' %} {% block title %}Login - Campus Service Booking{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center mt-5">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 p-md-5">
                
                <div class="text-center mb-4">
                    <h2 class="h4 fw-bold mb-3" style="color: var(--uofg-blue);">Login</h2>
                    <p class="text-muted small">Access your Campus Service Booking account</p>
                </div>

                <form method="post" action="{% url 'login' %}"> {% csrf_token %} 
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">University Email</label>
                        <input type="email" name="email" id="username" class="form-control form-control-lg" placeholder="e.g. 1234567x@student.gla.ac.uk" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <input type="password" name="password" id="password" class="form-control form-control-lg" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">Show</button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-uofg w-100 py-2 mb-3 fs-5">Log In</button>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <p class="small mb-0">Don't have an account? 
                        <a href="{% url 'register' %}" class="text-decoration-none fw-bold" style="color: var(--uofg-blue);">Register here</a>
                    </p>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.body.classList.add('login-body');
        document.querySelectorAll('.card').forEach(card => card.classList.add('login-card'));
        
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.textContent = type === 'password' ? 'Show' : 'Hide';
        });
    });
</script>
{% endblock %}
