{% extends 'booking/base.html' %}

{% block title %}Student Portal - Browse Services{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="fw-bold" style="color: var(--uofg-blue);">Student Portal</h2>
        <div>
            <a href="{% url 'my_bookings' %}" class="btn btn-outline-secondary btn-sm me-2">My Bookings</a>
            <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Logout</a>
        </div>
    </div>

    <p class="text-muted mb-5 fs-5">Select a Service Category to Browse:</p>

    <div class="row g-4 justify-content-center">
        {% for st in service_types %}
        <div class="col-12 col-md-4">
            <div class="card text-center h-100 service-category-card bg-white border-0 shadow-sm" style="border-top: 4px solid {{ st.color|default:'#002b5c' }} !important;">
                <div class="card-body py-5">
                    <div class="d-inline-block bg-light rounded-circle p-3 mb-3">
                        <div class="fs-1">{{ st.icon }}</div>
                    </div>
                    <h3 class="card-title fw-bold mb-4" style="color: var(--uofg-blue);">{{ st.name }}</h3>
                    <a href="{% url 'slots_by_type' st.id %}" class="btn btn-uofg px-4">view availability</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<style>
    :root {
        --uofg-blue: #002b5c;
    }
    .service-category-card {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        border-radius: 8px;
    }
    .service-category-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0,43,92,0.15) !important;
    }
    .btn-uofg {
        background-color: var(--uofg-blue);
        color: white !important;
        border: none;
        padding: 8px 20px;
        text-transform: lowercase;
        transition: background-color 0.2s;
    }
    .btn-uofg:hover {
        background-color: #001f44;
    }
</style>
{% endblock %}
